[project]
name = "ai-conversation-quality-framework"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "openai>=1.0.0",
  "scikit-learn>=1.4.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
